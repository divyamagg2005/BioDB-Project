[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biodb"
version = "0.1.0"
description = "ClinVar missense pathogenicity prediction with AlphaFold and FoldX features"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "data: checks generated phase outputs; skipped when the outputs are absent",
]
